<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <title>Edit Expense</title>
</head>

<body>

    <div class="container">

        <h1>Edit Expense</h1>

        <form method="POST"
              action="/update/{{ expense[0] }}">

            <div class="form-group">
                <label>Expense Name:</label>

                <input type="text"
                       name="name"
                       value="{{ expense[1] }}"
                       required>
            </div>

            <div class="form-group">
                <label>Amount:</label>

                <input type="number"
                       name="amount"
                       value="{{ expense[2] }}"
                       step="0.01"
                       min="0"
                       required>
            </div>

            <div class="form-group">
                <label>Category:</label>

                <input type="text"
                       name="category"
                       value="{{ expense[3] }}"
                       required>
            </div>

            <button type="submit">
                Update Expense
            </button>

            <a href="/" class="cancel-btn">
                Cancel
            </a>

        </form>

    </div>

</body>
</html>
